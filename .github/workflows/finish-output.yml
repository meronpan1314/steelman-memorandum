name: Finish Output

on:
  push:
    branches:
      - 'output-*'

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  finish-output:
    if: github.event.head_commit.message == 'finish'
    runs-on: ubuntu-latest

    steps:
      - name: Merge PR and complete issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          ISSUE_NUMBER="${BRANCH_NAME#output-}"
          if ! printf '%s' "$ISSUE_NUMBER" | grep -Eq '^[0-9]+$'; then
            echo "Branch name must be output-<issue-number>: $BRANCH_NAME" >&2
            exit 1
          fi

          PR_NUMBER="$(
            gh pr list \
              --repo "$GH_REPO" \
              --head "$BRANCH_NAME" \
              --state open \
              --json number \
              --jq '.[0].number'
          )"

          if [ -z "$PR_NUMBER" ]; then
            echo "No open PR found for $BRANCH_NAME" >&2
            exit 1
          fi

          gh pr merge "$PR_NUMBER" --repo "$GH_REPO" --merge --delete-branch

          ISSUE_STATE="$(gh issue view "$ISSUE_NUMBER" --repo "$GH_REPO" --json state --jq '.state')"
          if [ "$ISSUE_STATE" != "CLOSED" ]; then
            gh issue close "$ISSUE_NUMBER" --repo "$GH_REPO" --reason completed
          fi
