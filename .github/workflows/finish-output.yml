name: Finish Output

on:
  push:
    branches:
      - 'output-*'
  workflow_dispatch:
    inputs:
      branch_name:
        description: 'Target branch name, e.g. output-80'
        required: true
        type: string
      dry_run:
        description: 'Print actions without mutating GitHub resources'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  finish-output:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message == 'finish'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finish output
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH_NAME: ${{ github.event.inputs.branch_name || github.ref_name }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: bash .github/scripts/finish-output.sh
