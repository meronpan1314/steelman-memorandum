name: Create Output from Issue

on:
  issues:
    types: opened

permissions:
  contents: write
  pull-requests: write
  issues: read

jobs:
  create-output:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Git
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"

      - name: Create branch
        run: |
          BRANCH_NAME="output-${{ github.event.issue.number }}"
          git checkout -b $BRANCH_NAME

      - name: Create markdown file
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          ISSUE_LABELS: ${{ toJson(github.event.issue.labels.*.name) }}
        run: |
          set -euo pipefail

          FILE_NAME="$(
            printf '%s' "$ISSUE_TITLE" |
            sed -E 's/^\[Output\][[:space:]]*//'
          )"
          FILE_NAME="$(
            printf '%s' "$FILE_NAME" |
            sed -E 's#[/\\:*?"<>|]#-#g; s/^[[:space:]]+//; s/[[:space:]]+$//'
          )"

          if [ -z "$FILE_NAME" ]; then
            echo "File name is empty. Put the output word after [Output]." >&2
            exit 1
          fi

          CATEGORY="$(
            printf '%s\n' "$ISSUE_BODY" |
            sed -nE 's/^[[:space:]]*(category|Category|カテゴリ)[[:space:]]*:[[:space:]]*(.+)[[:space:]]*$/\2/p' |
            head -n 1
          )"

          if [ -z "$CATEGORY" ]; then
            CATEGORY="$(
              printf '%s' "$ISSUE_LABELS" |
              jq -r '.[] | select(test("^category:")) | sub("^category:[[:space:]]*"; "")' |
              head -n 1
            )"
          fi

          if [ -z "$CATEGORY" ]; then
            echo "Category is empty. Add 'Category: 15_AI' to the issue body or a 'category:15_AI' label." >&2
            exit 1
          fi

          CATEGORY="$(
            printf '%s' "$CATEGORY" |
            sed -E 's#[/\\:*?"<>|]#-#g; s/^[[:space:]]+//; s/[[:space:]]+$//'
          )"

          if ! printf '%s' "$CATEGORY" | grep -Eq '^[0-9]{2}_.+'; then
            echo "Category must look like '15_AI' or '18_NewCategory': $CATEGORY" >&2
            exit 1
          fi

          OUTPUT_DIR="contents/knowledge/$CATEGORY"
          OUTPUT_FILE="$OUTPUT_DIR/$FILE_NAME.md"
          ISSUE_DATE="$(date -u -d "$ISSUE_CREATED_AT" '+%Y-%m-%d')"

          mkdir -p "$OUTPUT_DIR"
          if [ -e "$OUTPUT_FILE" ]; then
            echo "File already exists: $OUTPUT_FILE" >&2
            exit 1
          fi

          awk -v title="$FILE_NAME" -v date="$ISSUE_DATE" '
            /^title:[[:space:]]*$/ {
              print "title: \"" title "\""
              next
            }
            {
              gsub(/2026-MM-DD/, date)
              print
            }
          ' 99_template/temp.md > "$OUTPUT_FILE"

      - name: Commit and Push
        run: |
          git status --short
          git add .
          git commit -m "create: ${{ github.event.issue.title }}"
          git push origin HEAD

      - name: Create PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat > "$RUNNER_TEMP/pr-body.md" <<'EOF'
          Issueより自動生成

          Closes #${{ github.event.issue.number }}
          EOF

          gh pr create \
            --title "${{ github.event.issue.title }}" \
            --body-file "$RUNNER_TEMP/pr-body.md" \
            --base main \
            --head "output-${{ github.event.issue.number }}"
